# macOS-only: Homebrew packages/taps, applied with `mise -E macos bootstrap`.
# Deployed to ~/.config/mise/conf.d/ only by the `macos` overlay (mise.macos.toml).
[bootstrap.brew.taps]
"securitypedant/octomon" = "https://github.com/securitypedant/homebrew-octomon.git"

[bootstrap.packages]
"brew:ansible-language-server" = "latest"
"brew:dutree" = "latest"
"brew:e2fsprogs" = "latest"
"brew:ffmpeg" = "latest"
"brew:git-graph" = "latest"
"brew:mactop" = "latest"
"brew:mise" = "latest"
"brew:mtr" = "latest"
"brew:securitypedant/octomon/octomon" = "latest"
"brew:podman" = "latest"
"brew:tree" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:cmux" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
