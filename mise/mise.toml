# Global mise config, shared by every host (deployed to ~/.config/mise/mise.toml).
[settings]
idiomatic_version_file_enable_tools = ["go", "python"]
minimum_release_age = "3d"

[tools]
# mise can't install on macos/x64 so we limit it to where it can install
atuin = { version = "latest", os = ["linux", "macos/arm64"] }
bottom = "latest"
ctop = "latest"
delta = "latest"
dive = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
go = "1.27"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
gping = "latest"
hyperfine = "latest"
jless = "latest"
jq = "latest"
just = "latest"
krew = "latest"
kubectl = "1.32"
kustomize = "latest"
lua-language-server = "latest"
neovim = "latest"
node = "lts"
"npm:vscode-langservers-extracted" = "latest"
podman-tui = "latest"
python = ["3.15", "3.12", "3.14"]
ripgrep = "latest"
ruby = "4"
rust = "stable"
starship = "latest"
taplo = "latest"
tmux = "latest"
tree-sitter = "latest"
upx = { version = "latest", os = ["linux"] }
uv = "latest"

# Homebrew taps are only a name -> URL lookup, so they are harmless on Linux.
[bootstrap.brew.taps]
"securitypedant/octomon" = "https://github.com/securitypedant/homebrew-octomon.git"

# macOS-only Homebrew packages, applied with `mise bootstrap`.
[bootstrap.packages]
"brew:ansible-language-server" = { version = "latest", os = ["macos"] }
"brew:dutree" = { version = "latest", os = ["macos"] }
"brew:e2fsprogs" = { version = "latest", os = ["macos"] }
"brew:ffmpeg" = { version = "latest", os = ["macos"] }
"brew:git-graph" = { version = "latest", os = ["macos"] }
"brew:mactop" = { version = "latest", os = ["macos"] }
"brew:mise" = { version = "latest", os = ["macos"] }
"brew:mtr" = { version = "latest", os = ["macos"] }
"brew:securitypedant/octomon/octomon" = { version = "latest", os = ["macos"] }
"brew:podman" = { version = "latest", os = ["macos"] }
"brew:tree" = { version = "latest", os = ["macos"] }
"brew-cask:1password-cli" = { version = "latest", os = ["macos"] }
"brew-cask:cmux" = { version = "latest", os = ["macos"] }
"brew-cask:font-jetbrains-mono-nerd-font" = { version = "latest", os = ["macos"] }
