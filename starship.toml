# Inserts a blank line between shell prompts
add_newline = true

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red) "

# Disable the package module, hiding it from the prompt completely
[package]
disabled = false

# Disable python and ruby, since they're really slow on
# my new el9 bastion for some reason
[python]
# make sure ~/.python-version points to ~/.pyenv/version, otherwise
# this is _very_ slow.
disabled = false

[ruby]
# make sure ~/.ruby-version points to ~/.rbenv/version, otherwise
# this is _very_ slow.
disabled = false

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "💀 "

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 20
style = "bold 214" #orange

[[battery.display]]
threshold = 40
style = "bold yellow"
